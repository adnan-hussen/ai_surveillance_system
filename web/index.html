<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Analytics Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0a0b0e] text-[#e4e4e7] m-0 p-0 overflow-hidden">
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const IconStub = ({ className = "w-3.5 h-3.5" }) => (
  <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <circle cx="12" cy="12" r="9" />
  </svg>
);
const Search = IconStub, Video = IconStub, Check = IconStub, X = IconStub,
      ChevronLeft = IconStub, ChevronRight = IconStub, Play = IconStub, Pause = IconStub,
      ShieldAlert = IconStub, LayoutGrid = IconStub, FileText = IconStub, Sliders = IconStub,
      Trash2 = IconStub, Eye = IconStub, EyeOff = IconStub, Camera = IconStub;


function App() {
  // --- Navigation & View State ---
  const [activeView, setActiveView] = useState('dashboard'); 
  const [incidentFilter, setIncidentFilter] = useState('ALL'); 
  const [showSettingsDrawer, setShowSettingsDrawer] = useState(false);

  // --- Pipeline Configuration State ---
  const [ruleInput, setRuleInput] = useState('Is there a person smoking?');
  const [activeRule, setActiveRule] = useState('Is there a person smoking?');
  const [threshold, setThreshold] = useState(0.65);
  const [paddingRatio, setPaddingRatio] = useState(0.35);
  const [verificationTimeoutSec, setVerificationTimeoutSec] = useState(45);
  const [showPaddedOverlay, setShowPaddedOverlay] = useState(true);

  // --- Stream & WebSocket State ---
  const [wsConnected, setWsConnected] = useState(false);
  const [currentFps, setCurrentFps] = useState(0);
  const [vlmLatencyMs, setVlmLatencyMs] = useState(0);

  // --- Flagged Subjects, 10-Frame Incident Buffers & Databases ---
  const [subjects, setSubjects] = useState({}); // subjectId -> FlaggedSubjectRecord
  const [selectedSubjectId, setSelectedSubjectId] = useState(null);
  const [selectedFrameIdx, setSelectedFrameIdx] = useState(0);
  const [isPlayingReplay, setIsPlayingReplay] = useState(false);
  const [replayViewMode, setReplayViewMode] = useState('full'); // 'full' | 'crop'
  const [incidentArchive, setIncidentArchive] = useState([]);
  const [toastMessage, setToastMessage] = useState(null);
  const [nowMs, setNowMs] = useState(Date.now());

  // --- Refs for High-FPS Video & Non-Blocking Canvas Overlay ---
  const overlayCanvasRef = useRef(null);
  const wsCanvasRef = useRef(null);
  const wsRef = useRef(null);
  const subjectsRef = useRef(subjects);
  const liveTracksRef = useRef([]);
  const sourceDimsRef = useRef({ width: 1280, height: 720 });
  const paddingRatioRef = useRef(paddingRatio);
  const showPaddedRef = useRef(showPaddedOverlay);

  useEffect(() => {
    subjectsRef.current = subjects;
  }, [subjects]);

  useEffect(() => {
    paddingRatioRef.current = paddingRatio;
  }, [paddingRatio]);

  useEffect(() => {
    showPaddedRef.current = showPaddedOverlay;
  }, [showPaddedOverlay]);

  const triggerToast = useCallback((text, type = 'info') => {
    setToastMessage({ text, type });
    setTimeout(() => {
      setToastMessage((prev) => (prev && prev.text === text ? null : prev));
    }, 3200);
  }, []);

  // --- Normalize Backend Flagged Subject Payload (Capped at 10 incident frames) ---
  const normalizeBackendSubject = useCallback((s) => {
    const rawFrames = s.frames.slice(0, 10);
    return {
      subjectId: s.subject_id,
      status: s.status, // 'unverified' (yellow) | 'verified' (red)
      detectionRule: s.detection_rule,
      initialConfidence: s.initial_confidence,
      peakConfidence: s.peak_confidence,
      createdAt: s.created_at * 1000,
      expiresAt: s.expires_at ? s.expires_at * 1000 : null,
      verifiedAt: s.verified_at ? s.verified_at * 1000 : null,
      camerasSeen: s.cameras_seen,
      trackId: Object.values(s.active_tracks)[0],
      latestBbox: s.latest_bbox,
      frameWidth: s.frame_width,
      frameHeight: s.frame_height,
      hasFaceEmbedding: s.has_face_embedding,
      faceCropB64: s.face_crop_b64,
      frames: rawFrames.map((f, idx) => ({
        frameId: f.frame_id,
        frameNumber: idx + 1,
        cameraId: f.camera_id,
        trackId: f.track_id,
        timestamp: f.timestamp * 1000,
        relSeconds: (f.timestamp - s.created_at).toFixed(2),
        matchProb: f.match_probability,
        bbox: f.bbox,
        cropB64: f.crop_b64,
        fullFrameB64: f.full_frame_b64
      }))
    };
  }, []);

  // --- Connect to Python Edge Compute Backend WebSocket (/ws) ---
  useEffect(() => {
    const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${proto}//${window.location.host}/ws`);
    wsRef.current = ws;

    const cachedImg = new Image();
    cachedImg.onload = () => {
      const c = wsCanvasRef.current;
      if (c.width !== cachedImg.width || c.height !== cachedImg.height) {
        c.width = cachedImg.width;
        c.height = cachedImg.height;
      }
      c.getContext('2d').drawImage(cachedImg, 0, 0);
    };

    ws.onopen = () => {
      setWsConnected(true);
      triggerToast('CONNECTED TO EDGE ANALYTICS SERVER (WS)', 'emerald');
    };

    ws.onmessage = (ev) => {
      const data = JSON.parse(ev.data);
      if (data.type === 'state_snapshot') {
        setActiveRule(data.detection_rule);
        setRuleInput(data.detection_rule);
        setThreshold(data.threshold);
        setVerificationTimeoutSec(data.verification_timeout_sec);
        const map = {};
        data.subjects.forEach((s) => {
          const norm = normalizeBackendSubject(s);
          map[norm.subjectId] = norm;
        });
        setSubjects(map);
        const firstId = Object.keys(map)[0];
        if (firstId) setSelectedSubjectId((prev) => prev || firstId);
      } else if (data.type === 'camera_frame') {
        cachedImg.src = data.frame_b64;
        sourceDimsRef.current = { width: data.frame_width, height: data.frame_height };
        liveTracksRef.current = data.tracks;
        setVlmLatencyMs(Math.round(data.decision_latency_ms));
      } else if (data.type === 'subject_flagged' || data.type === 'subject_updated') {
        const norm = normalizeBackendSubject(data.subject);
        setSubjects((prev) => ({ ...prev, [norm.subjectId]: norm }));
        setSelectedSubjectId((prev) => prev || norm.subjectId);
        if (data.type === 'subject_flagged') {
          triggerToast(`FLAGGED SUBJECT ${norm.subjectId} DETECTED`, 'amber');
        }
      } else if (data.type === 'subject_verified') {
        const norm = normalizeBackendSubject(data.subject);
        setSubjects((prev) => ({ ...prev, [norm.subjectId]: norm }));
        triggerToast(`SUBJECT ${norm.subjectId} VERIFIED`, 'red');
      } else if (data.type === 'subject_dismissed' || data.type === 'subject_expired') {
        const sid = data.subject_id;
        setSubjects((prev) => {
          const next = { ...prev };
          delete next[sid];
          return next;
        });
        triggerToast(
          data.type === 'subject_expired'
            ? `VERIFICATION TTL EXPIRED: ${sid} REMOVED FROM VECTOR DATABASE`
            : `ALERT DISMISSED: ${sid} REMOVED FROM VECTOR DATABASE`,
          'neutral'
        );
      }
    };

    ws.onclose = () => {
      setWsConnected(false);
      liveTracksRef.current = [];
    };
    return () => ws.close();
  }, [normalizeBackendSubject, triggerToast]);

  // --- 100ms Ticker for Live Verification TTL Countdowns & Auto-Purge from LanceDB ---
  useEffect(() => {
    const timer = setInterval(() => {
      const now = Date.now();
      setNowMs(now);

      const currentSubjects = subjectsRef.current;
      const expiredIds = [];
      Object.values(currentSubjects).forEach((s) => {
        if (s.status === 'unverified' && s.expiresAt && now >= s.expiresAt) {
          expiredIds.push(s.subjectId);
        }
      });

      if (expiredIds.length > 0) {
        setSubjects((prev) => {
          const next = { ...prev };
          expiredIds.forEach((id) => delete next[id]);
          return next;
        });
        triggerToast(`TTL EXPIRED: ${expiredIds.join(', ')} REMOVED FROM VECTOR DATABASE`, 'amber');
      }
    }, 100);
    return () => clearInterval(timer);
  }, [triggerToast]);

  // --- Auto-Play 10-Frame Incident Sequence Replay ---
  useEffect(() => {
    if (!isPlayingReplay) return;
    const currentSubject = selectedSubjectId ? subjects[selectedSubjectId] : null;
    if (!currentSubject || !currentSubject.frames.length) return;

    const timer = setInterval(() => {
      setSelectedFrameIdx((prev) => (prev + 1) % currentSubject.frames.length);
    }, 220);
    return () => clearInterval(timer);
  }, [isPlayingReplay, selectedSubjectId, subjects]);

  // --- 60 FPS Non-Blocking Vector Overlay Loop (Uses Real Subject Coordinates — Never Duplicates) ---
  useEffect(() => {
    let animId;
    let frames = 0;
    let lastTime = performance.now();

    const drawSubjectBox = (ctx, W, H, bbox, srcW, srcH, subjectId, status, confidence, trackId) => {
      const scaleX = W / srcW;
      const scaleY = H / srcH;

      const bx1 = Math.round(bbox.x1 * scaleX);
      const by1 = Math.round(bbox.y1 * scaleY);
      const bx2 = Math.round(bbox.x2 * scaleX);
      const by2 = Math.round(bbox.y2 * scaleY);
      const bw = Math.max(16, bx2 - bx1);
      const bh = Math.max(24, by2 - by1);

      const isVerified = status === 'verified';

      // bounding box
      const padX = Math.round(bw * paddingRatioRef.current);
      const padY = Math.round(bh * paddingRatioRef.current);
      const px1 = bbox.padded_x1 != null ? Math.round(bbox.padded_x1 * scaleX) : Math.max(6, bx1 - padX);
      const py1 = bbox.padded_y1 != null ? Math.round(bbox.padded_y1 * scaleY) : Math.max(6, by1 - padY);
      const px2 = bbox.padded_x2 != null ? Math.round(bbox.padded_x2 * scaleX) : Math.min(W - 6, bx2 + padX);
      const py2 = bbox.padded_y2 != null ? Math.round(bbox.padded_y2 * scaleY) : Math.min(H - 6, by2 + padY);

      if (showPaddedRef.current) {
        ctx.save();
        ctx.setLineDash([5, 4]);
        ctx.strokeStyle = isVerified ? 'rgba(239, 68, 68, 0.5)' : 'rgba(234, 179, 8, 0.55)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(px1, py1, px2 - px1, py2 - py1);

        ctx.fillStyle = 'rgba(10, 11, 14, 0.85)';
        ctx.fillRect(px1, Math.max(0, py1 - 18), 195, 16);
        ctx.fillStyle = '#a1a1aa';
        ctx.font = '600 10px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace';
        ctx.fillText(
          `CROP [+${Math.round(paddingRatioRef.current * 100)}%]`,
          px1 + 5,
          Math.max(11, py1 - 6)
        );
        ctx.restore();
      }

      // Primary Tactical Bounding Box: YELLOW for Unverified Alert, RED for Verified Subject
      const primaryColor = isVerified ? '#ef4444' : '#eab308';
      const headerBg = isVerified ? '#dc2626' : '#ca8a04';
      const statusTag = isVerified ? '[VERIFIED SUBJECT]' : '[UNVERIFIED ALERT]';

      ctx.save();
      ctx.strokeStyle = primaryColor;
      ctx.lineWidth = isVerified ? 3 : 2.5;
      ctx.shadowColor = primaryColor;
      ctx.shadowBlur = isVerified ? 12 : 6;
      ctx.strokeRect(bx1, by1, bw, bh);
      ctx.restore();

      // Top Tactical Header Bar on Bounding Box
      const headerH = 24;
      const headerW = Math.max(bw, 145);
      ctx.fillStyle = headerBg;
      ctx.fillRect(bx1, Math.max(0, by1 - headerH), headerW, headerH);

      ctx.fillStyle = isVerified ? '#ffffff' : '#090a0d';
      ctx.font = '700 11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace';
      const confStr = `${confidence.toFixed(2)} CONF`;
      ctx.fillText(`${subjectId}  ${confStr}`, bx1 + 7, Math.max(15, by1 - 8));

      // Bottom Tactical Telemetry Bar inside Bounding Box
      if (bh > 60 && bw > 110) {
        const footerH = 22;
        ctx.fillStyle = 'rgba(10, 11, 14, 0.90)';
        ctx.fillRect(bx1 + 2, by1 + bh - footerH - 2, bw - 4, footerH);
        ctx.fillStyle = primaryColor;
        ctx.font = '700 10px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace';
        ctx.fillText(
          `${statusTag} // #${trackId}`,
          bx1 + 6,
          by1 + bh - 8
        );
      }
    };

    const renderLoop = (ts) => {
      animId = requestAnimationFrame(renderLoop);
      frames++;
      if (ts - lastTime >= 1000) {
        setCurrentFps(Math.min(60, Math.round((frames * 1000) / (ts - lastTime))));
        frames = 0;
        lastTime = ts;
      }

      const canvas = overlayCanvasRef.current;
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      const W = canvas.width || 1280;
      const H = canvas.height || 720;
      ctx.clearRect(0, 0, W, H);

      const activeSubjectsMap = subjectsRef.current;
      const liveTracks = liveTracksRef.current;

      // Draw real-time tracked subjects at their exact YOLO26s + ByteTrack coordinates
      liveTracks.forEach((t) => {
          const sid = t.subject_id;
          if (!sid) return;
          const subjRec = activeSubjectsMap[sid];
          // Only draw if the subject is still active (not dismissed or expired)
          const activeStatus = subjRec ? subjRec.status : t.subject_status;
          if (!activeStatus || activeStatus === 'dismissed' || activeStatus === 'expired') return;

          drawSubjectBox(
            ctx,
            W,
            H,
            t.bbox,
            t.frame_width,
            t.frame_height,
            sid,
            activeStatus,
            subjRec ? subjRec.peakConfidence : t.match_probability,
            t.track_id
          );
      });

        };

    animId = requestAnimationFrame(renderLoop);
    return () => cancelAnimationFrame(animId);
  }, []);

  // --- Verify Flagged Subject (Turns Bounding Box RED & Locks Embedding in LanceDB) ---
  const handleVerifySubject = useCallback(
    (sid) => {
      if (!sid) return;
      if (wsConnected && wsRef.current) {
        wsRef.current.send(JSON.stringify({ action: 'verify_subject', subject_id: sid }));
      }
      const target = subjects[sid];
      if (!target) return;

      const verifiedTime = Date.now();
      setSubjects((prev) => {
        if (!prev[sid]) return prev;
        return {
          ...prev,
          [sid]: {
            ...prev[sid],
            status: 'verified', // Turns live bounding box RED
            verifiedAt: verifiedTime,
            expiresAt: null
          }
        };
      });

      setIncidentArchive((prev) => [
        {
          subjectId: target.subjectId,
          detectionRule: target.detectionRule,
          peakConfidence: target.peakConfidence,
          verifiedAt: verifiedTime,
          camerasSeen: target.camerasSeen,
          frameCount: target.frames.length,
          frames: target.frames
        },
        ...prev.filter((e) => e.subjectId !== sid)
      ]);

      triggerToast(`VERIFIED ${sid}`, 'red');
    },
    [subjects, wsConnected, triggerToast]
  );

  // --- Dismiss Alert (Purges Vector from LanceDB & Clears Bounding Box) ---
  const handleDismissSubject = useCallback(
    (sid) => {
      if (!sid) return;
      if (wsConnected && wsRef.current) {
        wsRef.current.send(JSON.stringify({ action: 'dismiss_subject', subject_id: sid }));
      }
      setSubjects((prev) => {
        const next = { ...prev };
        delete next[sid];
        return next;
      });
      if (selectedSubjectId === sid) {
        const remainingIds = Object.keys(subjects).filter((k) => k !== sid);
        setSelectedSubjectId(remainingIds[0] || null);
        setSelectedFrameIdx(0);
      }
      triggerToast(`ALERT DISMISSED ${sid} // REMOVED FROM VECTOR DATABASE`, 'neutral');
    },
    [selectedSubjectId, subjects, wsConnected, triggerToast]
  );

  const handleApplyDetectionRule = useCallback(
    (ruleText) => {
      const clean = (ruleText || '').trim();
      if (!clean) return;
      setRuleInput(clean);
      setActiveRule(clean);
      if (wsConnected && wsRef.current) {
        wsRef.current.send(
          JSON.stringify({
            action: 'set_detection_rule',
            detection_rule: clean,
            threshold,
            verification_timeout_sec: verificationTimeoutSec
          })
        );
      }
      triggerToast(`DETECTION RULE UPDATED: "${clean}"`, 'emerald');
    },
    [verificationTimeoutSec, threshold, triggerToast, wsConnected]
  );

  const allSubjectsList = Object.values(subjects).sort((a, b) => b.createdAt - a.createdAt);
  const unverifiedList = allSubjectsList.filter((s) => s.status === 'unverified');
  const verifiedList = allSubjectsList.filter((s) => s.status === 'verified');
  const selectedSubject = selectedSubjectId ? subjects[selectedSubjectId] : allSubjectsList[0] || null;
  const activeFrames = selectedSubject ? selectedSubject.frames : [];
  const currentFrame =
    activeFrames.length > 0 ? activeFrames[Math.min(selectedFrameIdx, activeFrames.length - 1)] : null;

  return (
    <div className="h-screen max-h-screen bg-[#0a0b0e] text-[#e4e4e7] font-mono flex flex-col select-none overflow-hidden">
      {/* Custom Scrollbar Styling for Internal Scrollable Containers */}
      <style>{`
        .tactical-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
        .tactical-scroll::-webkit-scrollbar-track { background: #090a0d; }
        .tactical-scroll::-webkit-scrollbar-thumb { background: #272b38; border-radius: 3px; }
        .tactical-scroll::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
      `}</style>

      {/* Tactical Toast Notification */}
      {toastMessage && (
        <div className="fixed top-14 right-5 z-50 pointer-events-none">
          <div
            className={`px-3.5 py-2 rounded border text-xs font-bold tracking-wider uppercase shadow-2xl flex items-center gap-2 ${
              toastMessage.type === 'red'
                ? 'bg-[#2a0a0e]/95 border-[#dc2626] text-[#fca5a5]'
                : toastMessage.type === 'amber'
                ? 'bg-[#281b05]/95 border-[#f59e0b] text-[#fde68a]'
                : toastMessage.type === 'emerald'
                ? 'bg-[#062419]/95 border-[#10b981] text-[#a7f3d0]'
                : 'bg-[#14171f]/95 border-[#3f3f46] text-[#e4e4e7]'
            }`}
          >
            <span
              className={`w-2 h-2 rounded-full ${
                toastMessage.type === 'red'
                  ? 'bg-[#ef4444]'
                  : toastMessage.type === 'amber'
                  ? 'bg-[#f59e0b]'
                  : 'bg-[#10b981]'
              }`}
            />
            {toastMessage.text}
          </div>
        </div>
      )}

      {/* =====================================================================
          ROW 1: TOP TACTICAL HEADER BAR (FIXED HEIGHT)
      ===================================================================== */}
      <header className="shrink-0 bg-[#0d0f13] border-b border-[#222631] px-3 py-2 flex flex-wrap items-center justify-between gap-2">
        <div className="flex items-center gap-3">
          <div className="bg-[#14171f] border border-[#2a2f3d] px-2.5 py-1.5 rounded flex items-center gap-2">
            <span className="w-2 h-2 rounded-full bg-[#ef4444] animate-pulse" />
            <div className="text-[11px] font-bold leading-tight tracking-wider text-white">
            </div>
          </div>
          <div>
            <h1 className="text-xs sm:text-sm font-bold tracking-widest uppercase text-white leading-tight">
              {activeView === 'dashboard'
                ? 'LIVE VIDEO STREAM & SUBJECT ANALYTICS'
                : 'INCIDENT LOGS'}
            </h1>
          </div>
        </div>

        {/* Right Telemetry Modules */}
        <div className="flex flex-wrap items-center gap-2 text-[10px]">
          <div className="bg-[#111318] border border-[#232732] px-2.5 py-1 rounded flex items-center gap-2">
            <span className="w-1.5 h-1.5 rounded-full bg-[#10b981]" />
          </div>

          <div className="bg-[#111318] border border-[#232732] px-2.5 py-1 rounded flex items-center gap-2">
            <span className="text-[#71717a]">STREAM:</span>
            <span className="text-[#10b981] font-bold">
              {wsConnected ? `ONLINE (${currentFps} FPS)` : 'OFFLINE'}
            </span>
          </div>

          <div className="bg-[#111318] border border-[#232732] px-2.5 py-1 rounded flex items-center gap-2">
            <span className="text-[#71717a]">UNVERIFIED:</span>
            <span className="text-[#eab308] font-bold">{unverifiedList.length} </span>
          </div>

          <div className="bg-[#111318] border border-[#232732] px-2.5 py-1 rounded flex items-center gap-2">
            <span className="text-[#71717a]">VERIFIED:</span>
            <span className="text-[#ef4444] font-bold">{verifiedList.length} </span>
          </div>

          <div className="bg-[#111318] border border-[#232732] px-2.5 py-1 rounded flex items-center gap-2">
            <span className="text-[#22c55e] font-bold">{allSubjectsList.length} RECORDS</span>
          </div>
        </div>
      </header>

      {/* =====================================================================
          ROW 2: DETECTION RULE BAR (FIXED HEIGHT)
      ===================================================================== */}
      <section className="shrink-0 bg-[#0f1116] border-b border-[#222631] px-3 py-2 flex flex-wrap items-center justify-between gap-2">
        <form
          onSubmit={(e) => {
            e.preventDefault();
            handleApplyDetectionRule(ruleInput);
          }}
          className="flex flex-wrap items-center gap-2 flex-1 min-w-[280px]"
        >
          <div className="flex items-center gap-1.5 text-[11px] font-bold text-[#a1a1aa] uppercase tracking-wider">
            <Search className="w-3.5 h-3.5 text-[#ef4444]" />
            <span>DETECTION RULE:</span>
          </div>

          <div className="relative flex-1 min-w-[220px] max-w-xl">
            <input
              type="text"
              value={ruleInput}
              onChange={(e) => setRuleInput(e.target.value)}
              placeholder="Define detection rule..."
              className="w-full bg-[#090a0d] border border-[#272b38] focus:border-[#e4e4e7] rounded px-3 py-1.5 pr-24 text-xs text-white focus:outline-none"
            />
          </div>

          <button
            type="submit"
            className="px-3.5 py-1.5 rounded bg-white hover:bg-[#e4e4e7] text-[#090a0d] font-bold text-xs uppercase tracking-wider transition"
          >
            APPLY RULE
          </button>
        </form>

        {/* Rule Presets & Parameter Controls */}
        <div className="flex flex-wrap items-center gap-1.5 text-[11px]">

          <button
            type="button"
            onClick={() => setShowSettingsDrawer((prev) => !prev)}
            className={`ml-1 px-2.5 py-1 rounded border text-[11px] flex items-center gap-1 transition ${
              showSettingsDrawer
                ? 'bg-white text-black border-white font-bold'
                : 'bg-[#12151c] border-[#262b38] text-[#a1a1aa] hover:text-white'
            }`}
          >
            <Sliders className="w-3 h-3" />
            <span>OPTIONS ({Math.round(threshold * 100)}% / {verificationTimeoutSec}s)</span>
          </button>
        </div>
      </section>

      {/* Collapsible Pipeline Hyperparameters Bar */}
      {showSettingsDrawer && (
        <div className="shrink-0 bg-[#12151c] border-b border-[#262b38] px-4 py-2 grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">

              </div>
            </div>

            {incidentFilter === 'LANCEDB' ? (
              <div className="flex-1 min-h-0 space-y-2 overflow-y-auto pr-1 tactical-scroll">
                <div className="text-[10px] text-[#a1a1aa] uppercase font-bold">
                  LANCEDB TABLE: subject_embeddings ({allSubjectsList.length} VECTORS)
                </div>
                {allSubjectsList.length === 0 ? (
                  <div className="p-4 border border-dashed border-[#262b38] rounded text-center text-xs text-[#71717a]">
                    LanceDB vector store is empty. Normal tracks are never stored.
                  </div>
                ) : (
                  allSubjectsList.map((s) => (
                    <div key={s.subjectId} className="p-3 rounded bg-[#0b0d12] border border-[#262b38] space-y-1.5 text-xs">
                      <div className="flex justify-between items-center">
                        <span className="font-bold text-white">{s.subjectId}</span>
                        <span
                          className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
                            s.status === 'verified'
                              ? 'bg-[#2a0a0e] text-[#ef4444] border border-[#dc2626]'
                              : 'bg-[#281b05] text-[#eab308] border border-[#eab308]'
                          }`}
                        >
                          {s.status}
                        </span>
                      </div>
                      <div className="text-[10px] text-[#9ca3af] font-mono">
                        VECTOR: {s.hasFaceEmbedding ? '512-D EMBEDDING STORED' : 'NO FACE EMBEDDED'}
                      </div>
                      <div className="flex justify-between items-center text-[10px] text-[#71717a] pt-1 border-t border-[#1d212b]">
                        <span>
                          {s.status === 'verified'
                            ? 'TTL: PERMANENT (VERIFIED)'
                            : `TTL: ${Math.max(0, ((s.expiresAt || nowMs) - nowMs) / 1000).toFixed(1)}s`}
                        </span>
                        <button
                          type="button"
                          onClick={() => handleDismissSubject(s.subjectId)}
                          className="text-[#ef4444] hover:underline flex items-center gap-1"
                        >
                          <Trash2 className="w-3 h-3" /> PURGE VECTOR
                        </button>
                      </div>
                    </div>
                  ))
                )}
              </div>
            ) : (
              <div className="flex-1 min-h-0 space-y-2.5 overflow-y-auto pr-1 tactical-scroll">
                {allSubjectsList
                  .filter((s) =>
                    incidentFilter === 'ALL'
                      ? true
                      : incidentFilter === 'UNVERIFIED'
                      ? s.status === 'unverified'
                      : s.status === 'verified'
                  )
                  .map((s) => {
                    const isSelected = selectedSubject && selectedSubject.subjectId === s.subjectId;
                    const isUnverified = s.status === 'unverified';
                    return (
                      <div
                        key={s.subjectId}
                        onClick={() => {
                          setSelectedSubjectId(s.subjectId);
                          setSelectedFrameIdx(0);
                        }}
                        className={`cursor-pointer p-3 rounded border transition relative ${
                          isSelected
                            ? 'bg-[#14171f] border-white shadow-lg'
                            : 'bg-[#0b0d12] border-[#222631] hover:border-[#3f3f46]'
                        }`}
                      >
                        <div className="flex items-center justify-between mb-1.5">
                          <span className="text-xs font-bold text-[#ef4444] flex items-center gap-1.5">
                            <span
                              className={`w-2 h-2 rounded-full ${
                                isUnverified ? 'bg-[#eab308]' : 'bg-[#ef4444]'
                              }`}
                            />
                            SUBJECT #{s.subjectId}
                          </span>
                          <span
                            className={`px-2 py-0.5 rounded text-[9px] font-extrabold uppercase ${
                              isUnverified
                                ? 'bg-[#f59e0b] text-black'
                                : 'bg-[#1f2430] border border-[#3f3f46] text-white'
                            }`}
                          >
                            {isUnverified ? 'PENDING VERIFICATION' : 'VERIFIED'}
                          </span>
                        </div>

                        <p className="text-xs text-white font-sans mb-2">{s.detectionRule}</p>

                        <div className="grid grid-cols-2 gap-2 bg-[#090a0d] border border-[#1d212b] p-2 rounded text-[10px]">
                          <div>
                            <div className="text-[#71717a]">MATCH PROBABILITY</div>
                            <div className="text-white font-bold text-xs mt-0.5">
                              {s.peakConfidence.toFixed(2)} (HIGH)
                            </div>
                          </div>
                          <div>
                            <div className="text-[#71717a]">CONFIDENCE SCORE</div>
                            <div className="text-[#10b981] font-bold text-xs mt-0.5">
                              {(s.peakConfidence * 100).toFixed(1)}%
                            </div>
                          </div>
                        </div>

                        <div className="flex items-center justify-between text-[10px] text-[#71717a] mt-2 pt-1.5 border-t border-[#1d212b]">

                          <span>{s.frames.length} / 10 INCIDENT FRAMES</span>
                        </div>
                      </div>
                    );
                  })}

                {allSubjectsList.length === 0 && (
                  <div className="p-6 border border-dashed border-[#262b38] rounded text-center text-xs text-[#71717a]">
                    No incidents logged yet.
                  </div>
                )}
              </div>
            )}
          </div>

          {/* RIGHT COLUMN (8 cols): 10-FRAME FORENSIC REPLAY & VERIFICATION BAR */}
          <div className="lg:col-span-8 bg-[#111318] border border-[#222631] rounded p-3 flex flex-col justify-between h-full min-h-0 overflow-hidden">
            {/* Top Replay Header */}
            <div className="shrink-0 flex flex-wrap items-center justify-between gap-2 border-b border-[#222631] pb-2">
              <div className="text-xs font-bold uppercase tracking-wider text-white">
                FRAMES FORENSIC REPLAY //{' '}
                <span className="text-[#71717a]">
                  {selectedSubject ? `${selectedSubject.subjectId}-CAM01` : 'NO SUBJECT'}
                </span>
              </div>

              <div className="flex items-center gap-3 text-xs">
                <div className="flex rounded overflow-hidden border border-[#2d3242] text-[10px]">
                  <button
                    type="button"
                    onClick={() => setReplayViewMode('full')}
                    className={`px-2 py-0.5 font-bold uppercase ${
                      replayViewMode === 'full' ? 'bg-white text-black' : 'bg-[#0b0d12] text-[#a1a1aa]'
                    }`}
                  >
                    SCENE FRAME (WITH BBOX)
                  </button>
                  <button
                    type="button"
                    onClick={() => setReplayViewMode('crop')}
                    className={`px-2 py-0.5 font-bold uppercase ${
                      replayViewMode === 'crop' ? 'bg-white text-black' : 'bg-[#0b0d12] text-[#a1a1aa]'
                    }`}
                  >
                    PADDED CROP (WITH BBOX)
                  </button>
                </div>

                <span className="text-[#ef4444] font-bold uppercase">
                  ● INCIDENT FRAME #{String(selectedFrameIdx + 1).padStart(2, '0')} OF{' '}
                  {String(activeFrames.length || 10).padStart(2, '0')}
                </span>
              </div>
            </div>

            {/* Center Frame Replay Display (Locked Flex Container) */}
            <div className="relative my-2 flex-1 min-h-0 bg-[#08090c] border border-[#1e222d] rounded overflow-hidden flex items-center justify-center">
              <div className="absolute top-3 left-3 w-4 h-4 border-t-2 border-l-2 border-[#52525b] pointer-events-none z-20" />
              <div className="absolute top-3 right-3 w-4 h-4 border-t-2 border-r-2 border-[#52525b] pointer-events-none z-20" />
              <div className="absolute bottom-3 left-3 w-4 h-4 border-b-2 border-l-2 border-[#52525b] pointer-events-none z-20" />
              <div className="absolute bottom-3 right-3 w-4 h-4 border-b-2 border-r-2 border-[#52525b] pointer-events-none z-20" />

              {currentFrame ? (
                <>
                  <img
                    src={replayViewMode === 'crop' ? currentFrame.cropB64 : currentFrame.fullFrameB64}
                    alt={currentFrame.frameId}
                    className="w-full h-full object-contain"
                  />
                  <div className="absolute top-4 left-4 bg-[#090a0d]/85 border border-[#262b38] px-2.5 py-1.5 rounded text-[10px] space-y-0.5">
                    <div className="text-white font-bold">
                      {selectedSubject.subjectId} // {currentFrame.frameId} (t = +{currentFrame.relSeconds}s)
                    </div>
                    <div className="text-[#a1a1aa]">
                      DETECTION RULE: {selectedSubject.detectionRule}
                    </div>
                  </div>
                  <div
                    className={`absolute top-4 right-4 px-2.5 py-1 rounded border text-[10px] font-bold uppercase ${
                      selectedSubject.status === 'verified'
                        ? 'bg-[#2a0a0e] border-[#dc2626] text-[#ef4444]'
                        : 'bg-[#281b05] border-[#eab308] text-[#eab308]'
                    }`}
                  >
                    MATCH: {(currentFrame.matchProb * 100).toFixed(1)}% //{' '}
                    {selectedSubject.status.toUpperCase()}
                  </div>
                </>
              ) : (
                <div className="text-xs text-[#71717a] uppercase">
                  NO INCIDENT FRAMES SELECTED
                </div>
              )}
            </div>

            {/* 10-Frame Sequence Buffer Strip */}
            <div className="shrink-0 bg-[#0b0d12] border border-[#222631] rounded p-2">
              <div className="flex items-center justify-between text-[10px] text-[#a1a1aa] uppercase mb-1.5">
                <span>INCIDENT CAPTURE SEQUENCE BUFFER [10 FRAMES WITH THIN BOUNDING BOX]</span>
                <span>CAPTURE INTERVAL: 120ms // 10 FRAMES MAX</span>
              </div>

              <div className="grid grid-cols-5 sm:grid-cols-10 gap-1.5">
                {activeFrames.slice(0, 10).map((f, idx) => {
                  const isActive = idx === selectedFrameIdx;
                  return (
                    <div
                      key={f.frameId}
                      onClick={() => setSelectedFrameIdx(idx)}
                      className={`cursor-pointer rounded border p-1 flex flex-col justify-between transition relative ${
                        isActive
                          ? 'bg-[#1a0d10] border-[#ef4444] ring-1 ring-[#ef4444]'
                          : 'bg-[#111318] border-[#232732] opacity-75 hover:opacity-100'
                      }`}
                    >
                      <img
                        src={f.fullFrameB64 || f.cropB64}
                        alt={f.frameId}
                        className="w-full h-11 object-cover rounded-sm"
                      />
                      <div className="flex items-center justify-between text-[9px] mt-1">
                        <span className="text-white font-bold">#{idx + 1}</span>
                        <span className={isActive ? 'text-[#ef4444] font-bold' : 'text-[#71717a]'}>
                          +{f.relSeconds}s
                        </span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Bottom Replay Controls & Verify/Dismiss Bar */}
            <div className="shrink-0 flex flex-wrap items-center justify-between gap-2 pt-2.5 mt-2 border-t border-[#222631]">
              <div className="flex items-center gap-1.5">
                <button
                  type="button"
                  onClick={() => setSelectedFrameIdx((i) => Math.max(0, i - 1))}
                  className="px-3 py-1.5 rounded bg-[#14171f] hover:bg-[#1e222d] border border-[#2d3242] text-white text-xs font-bold uppercase flex items-center gap-1"
                >
                  <ChevronLeft className="w-3.5 h-3.5" /> PREVIOUS
                </button>
                <button
                  type="button"
                  onClick={() => setIsPlayingReplay((p) => !p)}
                  className="px-3 py-1.5 rounded bg-[#14171f] hover:bg-[#1e222d] border border-[#2d3242] text-white text-xs font-bold uppercase flex items-center gap-1"
                >
                  {isPlayingReplay ? <Pause className="w-3.5 h-3.5" /> : <Play className="w-3.5 h-3.5" />}
                </button>
                <button
                  type="button"
                  onClick={() =>
                    setSelectedFrameIdx((i) => Math.min(Math.max(0, activeFrames.length - 1), i + 1))
                  }
                  className="px-3 py-1.5 rounded bg-[#14171f] hover:bg-[#1e222d] border border-[#2d3242] text-white text-xs font-bold uppercase flex items-center gap-1"
                >
                  NEXT <ChevronRight className="w-3.5 h-3.5" />
                </button>
              </div>

              {selectedSubject && (
                <div className="flex items-center gap-2">
                  {selectedSubject.status === 'unverified' && (
                    <button
                      type="button"
                      onClick={() => handleVerifySubject(selectedSubject.subjectId)}
                      className="px-4 py-1.5 rounded bg-[#dc2626] hover:bg-[#ef4444] text-white font-bold text-xs uppercase tracking-wider flex items-center gap-1.5 shadow-lg transition"
                    >
                      <Check className="w-3.5 h-3.5" /> VERIFY SUBJECT (RED BOX)
                    </button>
                  )}
                  <button
                    type="button"
                    onClick={() => handleDismissSubject(selectedSubject.subjectId)}
                    className="px-3.5 py-1.5 rounded bg-[#14171f] hover:bg-[#1e222d] border border-[#2d3242] text-[#d4d4d8] font-bold text-xs uppercase tracking-wider flex items-center gap-1 transition"
                  >
                    <X className="w-3.5 h-3.5" /> DISMISS ALERT
                  </button>
                </div>
              )}
            </div>
          </div>
        </main>
      )}

      {/* =====================================================================
          BOTTOM NAVIGATION & PIPELINE TELEMETRY FOOTER (FIXED HEIGHT)
      ===================================================================== */}
      <footer className="shrink-0 bg-[#0d0f13] border-t border-[#222631] px-3 py-2 flex flex-wrap items-center justify-between gap-2 text-[11px]">
        <div className="flex items-center gap-2">
          <button
            type="button"
            onClick={() => setActiveView('dashboard')}
            className={`px-3.5 py-1.5 rounded font-bold uppercase tracking-wider flex items-center gap-1.5 text-xs transition ${
              activeView === 'dashboard'
                ? 'bg-white text-[#090a0d]'
                : 'bg-[#14171f] text-[#a1a1aa] hover:text-white border border-[#262b38]'
            }`}
          >
            <LayoutGrid className="w-3.5 h-3.5" />
            DASHBOARD
          </button>

          <button
            type="button"
            onClick={() => setActiveView('incidents')}
            className={`px-3.5 py-1.5 rounded font-bold uppercase tracking-wider flex items-center gap-1.5 text-xs transition ${
              activeView === 'incidents'
                ? 'bg-white text-[#090a0d]'
                : 'bg-[#14171f] text-[#a1a1aa] hover:text-white border border-[#262b38]'
            }`}
          >
            <FileText className="w-3.5 h-3.5" />
            INCIDENT LOGS
            {unverifiedList.length > 0 && (
              <span className="w-2 h-2 rounded-full bg-[#ef4444]" />
            )}
          </button>
        </div>

        <div className="flex flex-wrap items-center gap-4 text-[10px] text-[#71717a] uppercase">
          <div className="flex items-center gap-1.5">
            <span className="w-2 h-2 rounded-full bg-[#10b981]" />
            <span>LATENCY:</span>
            <strong className="text-white">{vlmLatencyMs}ms</strong>
          </div>
          <div>
            <span>INCIDENT BUFFER:</span>{' '}
            <strong className="text-[#10b981]">10 FRAMES / ALERT</strong>
          </div>
          <div>
          </div>
          <div>
            <span>INCIDENT ARCHIVE:</span>{' '}
            <strong className="text-white">{incidentArchive.length} VERIFIED</strong>
          </div>
        </div>
      </footer>
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
